spring:
  application:
    name: exchange-api
  datasource:
    url: ${EXCHANGE_DB_URL:jdbc:postgresql://localhost:5432/exchange}
    username: ${EXCHANGE_DB_USER:exchange}
    password: ${EXCHANGE_DB_PASSWORD:exchange}
    hikari:
      maximum-pool-size: ${EXCHANGE_DB_POOL_SIZE:20}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
exchange:
  message:
    max-inline-bytes: 131072
    retention: 30d
  delivery:
    lease: 60s
    max-lease-budget: 15m
  security:
    issuer: ${EXCHANGE_JWT_ISSUER:https://login.microsoftonline.com/common/v2.0}
    audience: ${EXCHANGE_JWT_AUDIENCE:api://exchange}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"
