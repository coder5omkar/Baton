spring:
  application:
    name: exchange-worker
  main:
    web-application-type: none
    keep-alive: true
  datasource:
    url: ${EXCHANGE_DB_URL:jdbc:postgresql://localhost:5432/exchange}
    username: ${EXCHANGE_DB_USER:exchange}
    password: ${EXCHANGE_DB_PASSWORD:exchange}
    hikari:
      maximum-pool-size: ${EXCHANGE_DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    enabled: false
  jooq:
    sql-dialect: POSTGRES
  threads:
    virtual:
      enabled: true
exchange:
  broker:
    adapter: logging
  worker:
    outbox:
      claim-batch: 50
      lease: 30s
      poll-interval-ms: 1000
      max-backoff: 5m
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
